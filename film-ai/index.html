<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小鹿精华 · AI 宣传片</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ai.css">
</head>
<body>
<div id="viewport">
  <div id="stage">
    <video id="film" src="film.mp4" poster="poster.jpg" playsinline webkit-playsinline preload="auto"></video>
    <div id="veil"></div>
    <div id="glow"></div>
    <div id="scrim"></div>
    <svg id="lines" viewBox="0 0 1920 1080" aria-hidden="true">
      <g id="seg2"></g>
      <g id="seg4"></g>
      <g id="seg6"></g>
      <defs>
        <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="260" y1="0" x2="980" y2="0"><stop offset="0" stop-color="#b8894a" stop-opacity="0"/><stop offset=".15" stop-color="#b8894a" stop-opacity=".8"/><stop offset=".85" stop-color="#b8894a" stop-opacity=".8"/><stop offset="1" stop-color="#b8894a" stop-opacity="0"/></linearGradient>
      </defs>
      <path id="lat" d="M0 0" fill="none" stroke="url(#gl)" stroke-width="2.2" pathLength="1"/>
      <circle id="latDot" r="5" fill="#fff6e6" stroke="#b8894a" stroke-width="1.5"/>
      <g id="pin"><circle id="pinR1" r="30" fill="none" stroke="#f4dfb4" stroke-width="2"/><circle id="pinR2" r="30" fill="none" stroke="#f4dfb4" stroke-width="1.4"/><circle r="5" fill="#fff6e6" stroke="#b8894a" stroke-width="1.5"/></g>
    </svg>
    <div id="text">
      <div class="open" id="t-open"></div>
      <div class="coord" id="t-lat"></div>
      <div class="coord" id="t-lon"></div>
      <div class="place" id="t-place"></div>
      <div class="title" id="t-name"></div>
      <div class="sub" id="t-sub1"></div>
      <div class="sub" id="t-sub2"></div>
      <div class="sub" id="t-sub4"></div>
      <div class="two" id="t-two"></div>
      <div class="temp" id="t-temp"></div>
      <div class="sub" id="t-title6"></div>
      <div class="lock" id="t-lock"></div>
      <div class="head7" id="t-head7"></div>
      <div id="steps"></div>
      <div id="data">
        <div class="dh" id="d-h"></div>
        <div class="row"><div class="dn" id="d1n"></div><div class="dv" id="d1v"></div><i class="meter" id="d1m"></i></div>
        <div class="row"><div class="dn" id="d2n"></div><div class="dv" id="d2v"></div><i class="meter" id="d2m"></i></div>
        <div class="dnote" id="d-note"></div>
      </div>
    </div>
    <div id="hud"></div>
    <div id="bar"><i id="bar-fill"></i></div>
    <div id="cover">
      <button id="start" type="button" disabled>载入中…</button>
      <p class="hint">AI 宣传片 · 制作中 · 地球 → 双阳 → 鹿茸 → 蜡片 → 研 → 冻 → 释 · 含原配乐</p>
    </div>
    <div id="end" hidden>
      <p class="end-t">已完成段落到此结束</p>
      <div class="end-b">
        <button id="again" type="button">重播</button>
        <a href="../film/">现版正片 ↗</a>
        <a href="../film-pilot/video/">AI 视频试做段 ↗</a>
        <a href="../">返回首页</a>
      </div>
    </div>
  </div>
</div>
<script src="../film/assets/js/cues.js"></script>
<script src="track.js"></script>
<script src="seg2.js"></script>
<script src="seg4.js"></script>
<script src="seg6.js"></script>
<script src="seg7.js"></script>
<script src="ai.js"></script>
</body>
</html>
